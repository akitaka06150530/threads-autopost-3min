name: Threads 自動投稿

on:
  schedule:
    # JST 18:05 / 18:35（投稿）と 07:05 / 07:35（返信）。2回目は遅延・失敗時の保険
    - cron: "5,35 9 * * *"
    - cron: "5,35 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY RUN（投稿せずに確認だけ）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 投稿
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python post_threads.py
      - name: 投稿記録(state.json)を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "投稿記録を更新 [skip ci]" && git pull --rebase && git push)
